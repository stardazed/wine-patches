name: Build Wine (WoW64)

on:
  workflow_dispatch:
    inputs:
      wine_version:
        description: "Vanilla Wine version to build (e.g. 11.19, 11.20)"
        required: true
        default: "11.19"
      patch_dir:
        description: "Patch dir in this repo. Empty = patches/<wine_version>/ if it exists, else repo root"
        required: false
        default: ""
      revision:
        description: "Optional suffix to re-release the same Wine version (e.g. r2 -> tag wine-11.19-r2)"
        required: false
        default: ""
      configure_flags:
        description: "Extra ./configure flags"
        required: false
        default: "--without-oss --disable-winemenubuilder --disable-tests"
      runner:
        description: "Build OS. Older = runs on older distros (glibc), newer = newer mingw"
        type: choice
        options: [ubuntu-24.04, ubuntu-22.04]
        default: ubuntu-24.04
      publish:
        description: "Publish to GitHub Releases (off = only keep as workflow artifact)"
        type: boolean
        default: true

permissions:
  contents: write   # needed to create the release

env:
  WINE_VERSION: ${{ inputs.wine_version }}
  NAME: wine-${{ inputs.wine_version }}-patched-amd64-wow64

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # New WoW64 = ONE 64-bit build that also produces 32-bit PE dlls via mingw.
          # No i386 libs / chroots needed (unlike Kron4ek's old two-chroot setup).
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool bison flex gperf perl pkg-config \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 ccache wget xz-utils \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev \
            libxrender-dev libxcomposite-dev libxinerama-dev libxxf86vm-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev wayland-protocols libegl-dev libgl-dev libvulkan-dev \
            libfreetype-dev libfontconfig-dev libpulse-dev libasound2-dev libudev-dev \
            libusb-1.0-0-dev libsdl2-dev libgnutls28-dev libunwind-dev libdbus-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libcups2-dev libsane-dev \
            libv4l-dev libpcap-dev libkrb5-dev libcap2-dev libgphoto2-dev libopenal-dev \
            libsystemd-dev libxml2-dev libxslt1-dev libpcsclite-dev libusb-1.0-0-dev

      - name: Download Wine ${{ env.WINE_VERSION }} source
        run: |
          # Same dir logic as Kron4ek's build_wine.sh: X.0[.n] lives in X.0/, everything else in X.x/
          minor="$(cut -d. -f2 <<<"$WINE_VERSION")"
          major="$(cut -d. -f1 <<<"$WINE_VERSION")"
          [ "${minor:0:1}" = "0" ] && dir="$major.0" || dir="$major.x"
          tar_name="wine-$WINE_VERSION.tar.xz"
          wget -q "https://dl.winehq.org/wine/source/$dir/$tar_name" \
            || wget -q -O "$tar_name" "https://github.com/wine-mirror/wine/archive/refs/tags/wine-$WINE_VERSION.tar.gz" 
          mkdir wine && tar -xf "$tar_name" -C wine --strip-components=1
          cat wine/VERSION

      - name: Apply patches
        id: patches
        run: |
          dir="${{ inputs.patch_dir }}"
          if   [ -n "$dir" ];                   then :
          elif [ -d "patches/$WINE_VERSION" ];  then dir="patches/$WINE_VERSION"
          else                                       dir="."
          fi
          echo "Patch dir: $dir"
          shopt -s nullglob
          list=("$dir"/*.patch)
          [ ${#list[@]} -gt 0 ] || { echo "::error::No *.patch files in '$dir'"; exit 1; }
          : > applied.txt
          for p in "${list[@]}"; do          # sorted alphabetically = application order
            echo "==> $p"
            patch -d wine -Np1 --no-backup-if-mismatch < "$p" \
              || { echo "::error::$p does not apply to Wine $WINE_VERSION"; exit 1; }
            echo "- \`$(basename "$p")\`" >> applied.txt
          done

      - name: Regenerate generated files (what Kron4ek's script does after patching)
        working-directory: wine
        run: |
          tools/make_requests
          tools/make_specfiles
          autoreconf -f

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ inputs.runner }}-${{ github.run_id }}
          restore-keys: ccache-${{ inputs.runner }}-

      - name: Configure
        run: |
          mkdir build && cd build
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"   # ccache wraps gcc + both mingw compilers; persists to the Build step
          export PATH="/usr/lib/ccache:$PATH"
          ../wine/configure --enable-archs=i386,x86_64 \
            --prefix=/opt/$NAME ${{ inputs.configure_flags }} \
            CFLAGS="-O2" CROSSCFLAGS="-O2"

      - name: Build
        run: make -C build -j"$(nproc)"

      - name: Install and package
        run: |
          sudo make -C build install        # -> /opt/$NAME
          sudo find /opt/$NAME -type f \( -name '*.so' -o -name '*.so.*' \) -exec strip --strip-unneeded {} + 2>/dev/null || true
          # Kron4ek ships bin/wine as the 64-bit loader; new WoW64 already does that, just make sure it exists
          [ -e /opt/$NAME/bin/wine ] || sudo ln -s wine64 /opt/$NAME/bin/wine
          /opt/$NAME/bin/wine --version
          cd /opt && sudo env XZ_OPT="-9 -T0" tar -Jcf "$GITHUB_WORKSPACE/$NAME.tar.xz" "$NAME"
          cd "$GITHUB_WORKSPACE" && sha256sum "$NAME.tar.xz" | tee "$NAME.tar.xz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.tar.xz
            ${{ env.NAME }}.tar.xz.sha256

      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="wine-$WINE_VERSION${{ inputs.revision != '' && format('-{0}', inputs.revision) || '' }}"
          {
            echo "Vanilla Wine $WINE_VERSION, new WoW64 (32-bit apps run without 32-bit libs), x86_64 host."
            echo; echo "Patches applied (in order):"; cat applied.txt
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$NAME.tar.xz" "$NAME.tar.xz.sha256" --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" "$NAME.tar.xz" "$NAME.tar.xz.sha256" \
              --title "Wine $WINE_VERSION (patched, WoW64)" --notes-file notes.md
          fi